pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = 'warehouse'

// Optional add-on jars. Each builds to its own build/libs.
include 'controlify-addon'
